<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Web de Questões - MPPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca PDF.js oficial da Mozilla para leitura Client-Side (Zero Upload) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-6">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <div>
                <h1 class="text-2xl font-extrabold text-blue-900">Extrator Web 100% Client-Side</h1>
                <p class="text-sm text-gray-500">Lê PDFs de 200MB+ direto no navegador sem fazer upload do arquivo.</p>
            </div>
            <span class="text-xs font-bold px-3 py-1 bg-green-100 text-green-800 rounded-full">Zero Upload</span>
        </div>

        <!-- 1. Seleção do PDF -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">1. Selecione o seu PDF de Questões (200 MB):</label>
            <input type="file" id="pdf-input" accept="application/pdf" class="w-full text-sm text-gray-600 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-lg p-2 cursor-pointer">
            <p id="pdf-info" class="text-xs text-blue-600 font-semibold mt-2 hidden"></p>
        </div>

        <!-- 2. Filtro de Páginas -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Página Inicial:</label>
                <input type="number" id="page-start" value="1" min="1" class="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Página Final:</label>
                <input type="number" id="page-end" value="50" min="1" class="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- 3. Escolha do Modo -->
        <div class="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <label class="block text-sm font-bold text-gray-700 mb-1">Chave de API do Gemini (Opcional - Apenas para o Botão Azul):</label>
            <input type="password" id="api-key" placeholder="Cole sua chave gratuita do Google AI Studio (AIzaSy...)" class="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:border-blue-500 text-sm mb-2">
            <p class="text-xs text-gray-500">Se não quiser usar chave de API, use o <strong>Botão Verde</strong> abaixo para desidratar o PDF de 200 MB em um arquivo de texto leve (poucos KB) e enviá-lo direto no chat.</p>
        </div>

        <!-- Botões de Ação -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <button id="btn-extract-txt" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-sm">
                Modo 1: Baixar Texto Leve (.TXT)
            </button>
            <button id="btn-extract-json" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-sm">
                Modo 2: Gerar JSON Automático (Via API)
            </button>
        </div>

        <!-- Barra de Progresso e Log -->
        <div id="status-container" class="hidden">
            <div class="w-full bg-gray-200 rounded-full h-3 mb-2">
                <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all" style="width: 0%"></div>
            </div>
            <p id="status-text" class="text-xs font-mono text-gray-600 mb-4">Iniciando...</p>
            <textarea id="output-preview" rows="10" class="w-full p-3 bg-gray-900 text-green-400 font-mono text-xs rounded-lg outline-none" readonly placeholder="O resultado aparecerá aqui..."></textarea>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        const pdfInput = document.getElementById('pdf-input');
        const pdfInfo = document.getElementById('pdf-info');
        const pageStartInput = document.getElementById('page-start');
        const pageEndInput = document.getElementById('page-end');
        const statusContainer = document.getElementById('status-container');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const outputPreview = document.getElementById('output-preview');

        // Carrega o PDF na memória do navegador instantaneamente
        pdfInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            pdfInfo.classList.remove('hidden');
            pdfInfo.innerText = `Carregando "${file.name}" (${(file.size / 1024 / 1024).toFixed(1)} MB) na memória local...`;

            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            pageEndInput.value = pdfDoc.numPages;
            pageEndInput.max = pdfDoc.numPages;
            pdfInfo.innerText = `PDF pronto! Total de páginas detectadas: ${pdfDoc.numPages}.`;
        });

        // Função auxiliar para extrair texto de um intervalo de páginas
        async function extractTextFromPages(start, end) {
            let fullText = "";
            for (let pageNum = start; pageNum <= end; pageNum++) {
                const pct = Math.round(((pageNum - start + 1) / (end - start + 1)) * 100);
                progressBar.style.width = `${pct}%`;
                statusText.innerText = `Extraindo texto da página ${pageNum} de ${end} (${pct}%)...`;

                const page = await pdfDoc.getPage(pageNum);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += `\n\n--- [PÁGINA ${pageNum}] ---\n` + pageText;
            }
            return fullText;
        }

        // Faz o download de um arquivo gerado na memória do navegador
        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // MODO 1: Desidratar PDF para TXT Leve
        document.getElementById('btn-extract-txt').addEventListener('click', async () => {
            if (!pdfDoc) return alert("Selecione o arquivo PDF primeiro!");
            statusContainer.classList.remove('hidden');

            const start = parseInt(pageStartInput.value) || 1;
            const end = Math.min(parseInt(pageEndInput.value) || pdfDoc.numPages, pdfDoc.numPages);

            const extractedText = await extractTextFromPages(start, end);
            outputPreview.value = extractedText.substring(0, 4000) + "\n\n[... Pré-visualização truncada. O arquivo completo foi baixado! ...]";
            statusText.innerText = `Concluído! Os 200MB viraram apenas ${(extractedText.length / 1024).toFixed(1)} KB de texto puro.`;
            
            downloadFile(extractedText, `questoes_p${start}_a_p${end}.txt`, 'text/plain;charset=utf-8');
        });

        // MODO 2: Extrair e Converter em JSON Estruturado via Gemini API no Navegador
        document.getElementById('btn-extract-json').addEventListener('click', async () => {
            if (!pdfDoc) return alert("Selecione o arquivo PDF primeiro!");
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) return alert("Insira sua chave gratuita do Google AI Studio ou use o Botão Verde para baixar em .TXT!");

            statusContainer.classList.remove('hidden');
            const start = parseInt(pageStartInput.value) || 1;
            const end = Math.min(parseInt(pageEndInput.value) || pdfDoc.numPages, pdfDoc.numPages);
            const chunkSize = 5; // Processa de 5 em 5 páginas
            let allQuestions = [];

            const schema = {
                type: "ARRAY",
                items: {
                    type: "OBJECT",
                    properties: {
                        subject: { 
                            type: "STRING", 
                            enum: [
                                "Língua Portuguesa", "Matemática e RLM", "Informática", "Legislação MPPE",
                                "Direito Constitucional", "Direito Administrativo", "Direito Civil",
                                "Direito Processual Civil", "Direito Penal", "Direito Processual Penal",
                                "Noções de Administração", "Governança em TI", "Segurança, Risco e Continuidade",
                                "Engenharia de Software, DevOps e Ciência de Dados", "Infraestrutura e Banco de Dados"
                            ]
                        },
                        topic: { type: "STRING" },
                        type: { type: "STRING", enum: ["multipla", "vf"] },
                        supportText: { type: "STRING" },
                        q: { type: "STRING" },
                        options: { type: "ARRAY", items: { type: "STRING" } },
                        answer: { type: "INTEGER" },
                        disclaimer: { type: "STRING" }
                    },
                    required: ["subject", "topic", "type", "supportText", "q", "options", "answer", "disclaimer"]
                }
            };

            for (let p = start; p <= end; p += chunkSize) {
                const chunkEnd = Math.min(p + chunkSize - 1, end);
                const chunkText = await extractTextFromPages(p, chunkEnd);
                statusText.innerText = `Formatando questões das páginas ${p} a ${chunkEnd} via IA...`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `Extraia todas as questões deste trecho. Classifique em uma das disciplinas permitidas, coloque o gabarito numérico correto (0=A, 1=B...) e justifique em disclaimer:\n\n${chunkText}`
                                }]
                            }],
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: schema,
                                temperature: 0.1
                            }
                        })
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
                        allQuestions.push(...parsed);
                        outputPreview.value = JSON.stringify(allQuestions, null, 2);
                    }
                } catch (err) {
                    console.error("Erro no lote:", err);
                }
            }

            statusText.innerText = `Sucesso! ${allQuestions.length} questões extraídas e validadas.`;
            downloadFile(JSON.stringify(allQuestions, null, 2), `questoes_extraidas_p${start}_p${end}.json`, 'application/json;charset=utf-8');
        });
    </script>
</body>
</html>
