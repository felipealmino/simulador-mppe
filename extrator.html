<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Web OCR & Visão IA - MPPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js para renderizar páginas digitalizadas em Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Tesseract.js para OCR 100% no navegador (Modo sem API) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-6">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-6 pb-4 border-b">
            <div>
                <h1 class="text-2xl font-extrabold text-blue-900">Extrator Web para PDFs Digitalizados (OCR)</h1>
                <p class="text-sm text-gray-500">Converte páginas em imagem diretamente no navegador.</p>
            </div>
            <span class="text-xs font-bold px-3 py-1 bg-purple-100 text-purple-800 rounded-full">Suporte a Imagens</span>
        </div>

        <!-- 1. Seleção do Ficheiro -->
        <div class="mb-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">1. Selecione o seu PDF Digitalizado:</label>
            <input type="file" id="pdf-input" accept="application/pdf" class="w-full text-sm text-gray-600 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-lg p-2 cursor-pointer">
            <p id="pdf-info" class="text-xs text-blue-600 font-semibold mt-2 hidden"></p>
        </div>

        <!-- 2. Intervalo de Páginas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Página Inicial:</label>
                <input type="number" id="page-start" value="1" min="1" class="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Página Final (Recomendado: 2 a 5):</label>
                <input type="number" id="page-end" value="5" min="1" class="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Qualidade da Imagem (Escala):</label>
                <select id="scale-select" class="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:border-blue-500 bg-white">
                    <option value="1.5" selected>Rápida (1.5x - Ideal para IA)</option>
                    <option value="2.0">Alta Nitidez (2.0x)</option>
                </select>
            </div>
        </div>

        <!-- 3. Configuração da Chave de API -->
        <div class="mb-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
            <label class="block text-sm font-bold text-blue-900 mb-1">Chave de API do Gemini (Para o Modo 1 - Visão IA):</label>
            <input type="password" id="api-key" placeholder="Cole a sua chave gratuita do Google AI Studio (AIzaSy...)" class="w-full p-2.5 border border-blue-300 rounded-lg outline-none focus:border-blue-600 text-sm mb-2 bg-white">
            <p class="text-xs text-blue-800">
                Crie uma chave gratuita em <a href="https://aistudio.google.com/app/apikey" target="_blank" class="underline font-bold">aistudio.google.com/app/apikey</a>.
            </p>
        </div>

        <!-- Botões de Ação -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <button id="btn-vision-json" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-lg transition shadow-sm">
                Modo 1: Ler Imagens com IA e Baixar JSON
            </button>
            <button id="btn-tesseract-txt" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-lg transition shadow-sm">
                Modo 2: OCR Local (Tesseract) para .TXT
            </button>
        </div>

        <!-- Pré-visualização e Progresso -->
        <div id="status-container" class="hidden">
            <div class="w-full bg-gray-200 rounded-full h-3 mb-2">
                <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all" style="width: 0%"></div>
            </div>
            <p id="status-text" class="text-xs font-mono text-gray-600 mb-4">A preparar motor gráfico...</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="border rounded-lg p-2 bg-gray-50 flex flex-col items-center">
                    <span class="text-[10px] font-bold text-gray-400 uppercase mb-1">Página Atual Renderizada</span>
                    <canvas id="pdf-canvas" class="max-w-full h-auto border shadow-sm"></canvas>
                </div>
                <div class="md:col-span-2">
                    <textarea id="output-preview" rows="14" class="w-full p-3 bg-gray-900 text-green-400 font-mono text-xs rounded-lg outline-none" readonly placeholder="As questões extraídas aparecerão aqui em tempo real..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        const pdfInput = document.getElementById('pdf-input');
        const pdfInfo = document.getElementById('pdf-info');
        const pageStartInput = document.getElementById('page-start');
        const pageEndInput = document.getElementById('page-end');
        const scaleSelect = document.getElementById('scale-select');
        const statusContainer = document.getElementById('status-container');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const outputPreview = document.getElementById('output-preview');
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        pdfInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            pdfInfo.classList.remove('hidden');
            pdfInfo.innerText = `A abrir "${file.name}" (${(file.size / 1024 / 1024).toFixed(1)} MB) na memória local...`;

            const arrayBuffer = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            pageEndInput.max = pdfDoc.numPages;
            pageEndInput.value = Math.min(5, pdfDoc.numPages);
            pdfInfo.innerText = `PDF carregado! Total de ${pdfDoc.numPages} páginas digitalizadas.`;
        });

        async function renderPageToBase64(pageNum, scale = 1.5) {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale });
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({ canvasContext: ctx, viewport }).promise;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            return {
                dataUrl,
                base64: dataUrl.split(',')[1]
            };
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        // MODO 1: VISÃO MULTIMODAL DIRETA PARA JSON
        document.getElementById('btn-vision-json').addEventListener('click', async () => {
            if (!pdfDoc) return alert("Selecione primeiro o ficheiro PDF!");
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) return alert("Cole a sua chave gratuita do Google AI Studio no campo próprio!");

            statusContainer.classList.remove('hidden');
            const start = parseInt(pageStartInput.value) || 1;
            const end = Math.min(parseInt(pageEndInput.value) || 5, pdfDoc.numPages);
            const scale = parseFloat(scaleSelect.value) || 1.5;
            const batchSize = 2; 
            let extractedQuestions = [];

            const schema = {
                type: "ARRAY",
                items: {
                    type: "OBJECT",
                    properties: {
                        subject: { type: "STRING", description: "Nome da disciplina." },
                        topic: { type: "STRING", description: "Assunto específico da questão." },
                        type: { type: "STRING", enum: ["multipla", "vf"] },
                        supportText: { type: "STRING", description: "Texto base ou de apoio completo, se houver." },
                        q: { type: "STRING", description: "Enunciado limpo da questão." },
                        options: { 
                            type: "ARRAY", 
                            items: { type: "STRING" },
                            description: "Alternativas sem as letras a, b, c, d, e."
                        },
                        answer: { type: "INTEGER", description: "Índice numérico da alternativa correta (0 para A, 1 para B, etc.)." },
                        disclaimer: { type: "STRING", description: "Justificativa teórica ou fundamentação." }
                    },
                    required: ["subject", "topic", "type", "supportText", "q", "options", "answer", "disclaimer"]
                }
            };

            for (let p = start; p <= end; p += batchSize) {
                const batchEnd = Math.min(p + batchSize - 1, end);
                const pct = Math.round(((p - start + 1) / (end - start + 1)) * 100);
                progressBar.style.width = `${pct}%`;
                statusText.innerText = `A processar páginas ${p} a ${batchEnd} com Visão IA (${pct}%)...`;

                const parts = [{
                    text: "Analise estas páginas de provas digitalizadas. Extraia TODAS as questões visíveis. Se houver um texto de apoio ('Texto CB...'), inclua-o integralmente no campo 'supportText'."
                }];

                for (let curr = p; curr <= batchEnd; curr++) {
                    const img = await renderPageToBase64(curr, scale);
                    parts.push({
                        inlineData: {
                            mimeType: "image/jpeg",
                            data: img.base64
                        }
                    });
                }

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts }],
                            generationConfig: {
                                responseMimeType: "application/json",
                                responseSchema: schema,
                                temperature: 0.1
                            }
                        })
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                        const responseText = data.candidates[0].content.parts[0].text;
                        const novas = JSON.parse(responseText);
                        if (novas.length > 0) {
                            extractedQuestions.push(...novas);
                            outputPreview.value = `// Total acumulado: ${extractedQuestions.length} questões\n` + JSON.stringify(extractedQuestions, null, 2);
                        }
                    } else if (data.error) {
                        console.warn(`Erro na API: ${data.error.message}`);
                    }
                } catch (err) {
                    console.error("Erro na requisição:", err);
                }

                await sleep(3000);
            }

            progressBar.style.width = `100%`;
            statusText.innerText = `Concluído! ${extractedQuestions.length} questões extraídas com sucesso.`;
            downloadFile(JSON.stringify(extractedQuestions, null, 2), `questoes_extraidas_p${start}_a_p${end}.json`, 'application/json;charset=utf-8');
        });

        // MODO 2: OCR LOCAL (TESSERACT)
        document.getElementById('btn-tesseract-txt').addEventListener('click', async () => {
            if (!pdfDoc) return alert("Selecione primeiro o ficheiro PDF!");
            statusContainer.classList.remove('hidden');

            const start = parseInt(pageStartInput.value) || 1;
            const end = Math.min(parseInt(pageEndInput.value) || 5, pdfDoc.numPages);
            const scale = parseFloat(scaleSelect.value) || 2.0;

            statusText.innerText = "A iniciar motor OCR em Português...";
            const worker = await Tesseract.createWorker('por');
            let fullOcrText = "";

            for (let pageNum = start; pageNum <= end; pageNum++) {
                const pct = Math.round(((pageNum - start + 1) / (end - start + 1)) * 100);
                progressBar.style.width = `${pct}%`;
                statusText.innerText = `A executar OCR na página ${pageNum} de ${end} (${pct}%)...`;

                const img = await renderPageToBase64(pageNum, scale);
                const { data: { text } } = await worker.recognize(img.dataUrl);

                fullOcrText += `\n\n--- [PÁGINA ${pageNum}] ---\n` + text;
                outputPreview.value = fullOcrText;
                outputPreview.scrollTop = outputPreview.scrollHeight;
            }

            await worker.terminate();
            statusText.innerText = `OCR concluído! Ficheiro gerado.`;
            downloadFile(fullOcrText, `ocr_texto_p${start}_a_p${end}.txt`, 'text/plain;charset=utf-8');
        });
    </script>
</body>
</html>
