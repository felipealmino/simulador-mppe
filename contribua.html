<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPE | Painel de Envio de Questões</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="questoes.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-blue-900 text-lg tracking-tight">MPPE</span>
            <span class="text-slate-300">|</span>
            <span class="text-slate-600 font-medium text-sm">Painel de Envio de Questões</span>
        </div>
        <a href="index.html" class="text-xs font-bold text-blue-600 hover:underline">← Voltar ao Simulador</a>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex items-center justify-center">
        <div id="card-formulario" class="w-full bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-xl font-bold text-slate-900 mb-1">ENVIE SUAS QUESTÕES</h1>
            <p class="text-xs text-slate-500 mb-6">Cole o texto bruto da prova abaixo. Não precisa se preocupar com a formatação.</p>

            <!-- Seleção de Cargo Alvo -->
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Cargo Alvo:</label>
                <select id="input-cargo" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600">
                    <option value="Técnico Ministerial - Área Administrativa">Técnico Ministerial - Área Administrativa</option>
                    <option value="Analista Ministerial - Direito">Analista Ministerial - Direito</option>
                    <option value="Analista Ministerial - Área Especializada">Analista Ministerial - Área Especializada</option>
                </select>
            </div>

            <!-- Área de Texto Bruto -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Texto da Prova:</label>
                <textarea id="input-texto-bruto" rows="10" placeholder="Cole aqui o texto copiado do PDF..." class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs font-mono outline-none focus:border-blue-600"></textarea>
            </div>

            <button id="btn-enviar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-sm">
                Enviar Contribuição
            </button>
        </div>

        <!-- Mensagem de Sucesso (Oculta Inicialmente) -->
        <div id="card-sucesso" class="w-full bg-white p-12 rounded-2xl shadow-sm border border-slate-200 text-center hidden">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">✓</div>
            <h2 class="text-xl font-bold text-slate-900 mb-2">Contribuição Enviada com Sucesso!</h2>
            <p class="text-xs text-slate-500 mb-6">Obrigado! O texto foi encaminhado. Em breve suas questões serão adicionadas!</p>
            <a href="index.html" class="inline-block bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl text-xs transition">
                Voltar ao Simulador
            </a>
        </div>
    </main>

    <!-- Script de Processamento, Limpeza de OCR e Envio via Webhook -->
    <script>
        const topicosEdital = [
            "licitações", "atos administrativos", "contratos", "sintaxe", 
            "crase", "interpretação", "poderes administrativos", "improbidade",
            "direitos fundamentais", "organização do estado", "responsabilidade civil"
        ];

        function sanitizarOCR(texto) {
            if (!texto) return "";
            return texto
                .replace(/Caderno de Prova[\s\S]*?(?=\b(?:questão|\d{1,2}\s*[\-\.\)]))/gi, '')
                .replace(/([a-zA-ZÀ-ÿ])-[\s\r\n]+([a-zA-ZÀ-ÿ])/g, '$1$2')
                .replace(/[\r\n]+/g, ' ')
                .replace(/\s{2,}/g, ' ')
                .trim();
        }

        function normalizar(texto) {
            return texto.toLowerCase().replace(/[^\w\s]/gi, '').replace(/\s+/g, ' ').trim();
        }

        document.getElementById('btn-enviar').addEventListener('click', async () => {
            const cargo = document.getElementById('input-cargo').value;
            const textoBruto = document.getElementById('input-texto-bruto').value.trim();

            if (!textoBruto) {
                alert("Por favor, cole o texto bruto da prova antes de enviar.");
                return;
            }

            const btn = document.getElementById('btn-enviar');
            btn.innerText = "Processando e Enviando...";
            btn.disabled = true;

            // 1. Limpeza de OCR e fatiamento
            const textoLimpo = sanitizarOCR(textoBruto);
            const blocosBrutos = textoLimpo.split(/(?=\b\d{1,2}\s*[\-\.\)])/g).filter(b => b.trim().length > 20);
            
            let questoesProcessadas = [];

            blocosBrutos.forEach(bloco => {
                const ehVF = /certo|errado/i.test(bloco) && !/alternativa [a-d]/i.test(bloco);
                const blocoNorm = normalizar(bloco);
                const topicoEncontrado = topicosEdital.find(t => blocoNorm.includes(t)) || "Geral / Conteúdo Programático";

                const novaQuestao = {
                    cargoAlvo: cargo,
                    topic: topicoEncontrado,
                    type: ehVF ? "vf" : "multipla",
                    supportText: "",
                    q: bloco.trim(),
                    options: ehVF ? [] : ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
                    answer: 0,
                    disclaimer: "Extraído e limpo via painel de contribuição."
                };

                // Checa duplicidade interna no lote
                if (!questoesProcessadas.some(q => normalizar(q.q) === normalizar(novaQuestao.q))) {
                    questoesProcessadas.push(novaQuestao);
                }
            });

            // Prepara o payload para envio ao Webhook (Formspree)
            const codigoFormatado = JSON.stringify(questoesProcessadas, null, 4);
            const dadosEnvio = {
                cargo: cargo,
                total_questoes: questoesProcessadas.length,
                codigo_json: codigoFormatado
            };

            try {
                // URL GERADA NO FORMSPREE
                const response = await fetch('https://formspree.io/f/mppqeydl', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(dadosEnvio)
                });

                if (response.ok) {
                    document.getElementById('card-formulario').classList.add('hidden');
                    document.getElementById('card-sucesso').classList.remove('hidden');
                } else {
                    alert("Ocorreu um erro ao enviar. Tente novamente mais tarde.");
                    btn.innerText = "Enviar Contribuição";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Erro de conexão ao enviar os dados.");
                btn.innerText = "Enviar Contribuição";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
