<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPE | Simulador Estratégico</title>
    <!-- Tailwind CSS para o design moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="questoes.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-blue-900 text-lg tracking-tight">MPPE</span>
            <span class="text-slate-300">|</span>
            <span class="text-slate-600 font-medium text-sm">Simulador Estratégico</span>
        </div>
        <span class="text-xs text-slate-400 font-medium">Desenvolvido por Felipe Almino</span>
    </header>

    <!-- Conteúdo Principal / Configuração do Treino -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div id="card-config" class="w-full max-w-2xl bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <div class="mb-6 pb-4 border-b border-slate-100">
                <h1 class="text-2xl font-bold text-slate-900">Configure o seu treino</h1>
                <p class="text-sm text-slate-500 mt-1">Defina os parâmetros do seu caderno de questões.</p>
            </div>

            <!-- Cargo Alvo -->
            <div class="mb-5">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Cargo Alvo:</label>
                <select id="cargo-alvo" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none focus:border-blue-600 text-sm font-medium text-slate-700">
                    <option value="tecnico_adm">Técnico Ministerial - Área Administrativa</option>
                    <option value="analista_direito">Analista Ministerial - Direito</option>
                </select>
            </div>

            <!-- Tipo de Questão -->
            <div class="mb-5">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Tipo de Questão:</label>
                <select id="filtro-tipo" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none focus:border-blue-600 text-sm font-medium text-slate-700">
                    <option value="todas">Todas (Múltipla Escolha e Certo/Errado)</option>
                    <option value="multipla">Apenas Múltipla Escolha</option>
                    <option value="vf">Apenas Certo / Errado (CESPE)</option>
                </select>
            </div>

            <!-- Distribuição de Questões por Disciplina (Preenchida dinamicamente) -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Distribuição de Questões por Disciplina:</label>
                <div id="container-disciplinas" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- As disciplinas e contadores serão injetados aqui via script -->
                </div>
            </div>

            <!-- Modo Simulado (Com Tempo) -->
            <div class="mb-8 p-4 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
                <div>
                    <h2 class="text-sm font-bold text-slate-800">Modo Simulado Real (Com Tempo)</h2>
                    <p class="text-xs text-slate-500">Estabelece um cronômetro e finaliza automaticamente ao esgotar.</p>
                </div>
                <div class="flex items-center space-x-3">
                    <input type="number" id="tempo-simulado" value="30" min="5" max="300" class="w-16 p-2 text-center bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-700 outline-none">
                    <span class="text-xs font-bold text-slate-500">min.</span>
                    <input type="checkbox" id="toggle-tempo" class="w-5 h-5 accent-blue-600 rounded cursor-pointer" checked>
                </div>
            </div>

            <!-- Botão Gerar Caderno -->
            <button id="btn-gerar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition shadow-sm text-sm tracking-wide">
                Gerar Caderno de Questões
            </button>
        </div>

        <!-- Área da Prova / Oculta Inicialmente -->
        <div id="card-prova" class="w-full max-w-3xl bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                <div>
                    <span id="prova-disciplina" class="text-xs font-bold px-2.5 py-1 bg-blue-50 text-blue-700 rounded-md">Disciplina</span>
                    <h2 id="prova-progresso" class="text-sm font-semibold text-slate-500 mt-2">Questão 1 de 10</h2>
                </div>
                <div id="cronometro-box" class="text-sm font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-lg">
                    ⏱️ <span id="tempo-restante">30:00</span>
                </div>
            </div>

            <!-- Enunciado e Texto de Apoio -->
            <div id="area-conteudo-questao" class="mb-6 space-y-4">
                <!-- Injetado dinamicamente -->
            </div>

            <!-- Navegação da Prova -->
            <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                <button id="btn-anterior" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg text-sm font-semibold hover:bg-slate-50 transition">Anterior</button>
                <button id="btn-proxima" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold transition shadow-sm">Próxima Questão</button>
            </div>
        </div>
    </main>

    <!-- Script de Integração e Comportamento do Simulador -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const containerDisciplinas = document.getElementById('container-disciplinas');
            
            // 1. Carrega as disciplinas dinamicamente do mockDB (definido no questoes.js)
            if (typeof mockDB !== 'undefined') {
                Object.keys(mockDB).forEach(disciplina => {
                    const total = mockDB[disciplina].length;
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200";
                    div.innerHTML = `
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" id="disc_${disciplina}" value="${disciplina}" class="w-4 h-4 accent-blue-600 rounded cursor-pointer" ${total > 0 ? 'checked' : ''}>
                            <label for="disc_${disciplina}" class="text-sm font-semibold text-slate-700 cursor-pointer">${disciplina}</label>
                        </div>
                        <span class="text-xs font-bold text-slate-500 bg-slate-200/70 px-2.5 py-1 rounded-full">${total} q.</span>
                    `;
                    containerDisciplinas.appendChild(div);
                });
            } else {
                containerDisciplinas.innerHTML = `<p class="text-xs text-red-500 font-medium">Erro: Ficheiro questoes.js não foi carregado corretamente.</p>`;
            }

            // 2. Ação do Botão Gerar Caderno
            document.getElementById('btn-gerar').addEventListener('click', () => {
                const checkedDisciplinas = Array.from(document.querySelectorAll('#container-disciplinas input[type="checkbox"]:checked'))
                    .map(cb => cb.value);

                if (checkedDisciplinas.length === 0) {
                    alert("Selecione pelo menos uma disciplina para gerar o caderno!");
                    return;
                }

                // Agrega as questões selecionadas
                let cadernoQuestoes = [];
                checkedDisciplinas.forEach(disc => {
                    if (mockDB[disc]) {
                        cadernoQuestoes.push(...mockDB[disc]);
                    }
                });

                if (cadernoQuestoes.length === 0) {
                    alert("As disciplinas selecionadas não possuem questões cadastradas no momento. Adicione questões no questoes.js para iniciar.");
                    return;
                }

                // Alterna a visualização da tela de configuração para a tela de prova
                document.getElementById('card-config').classList.add('hidden');
                document.getElementById('card-prova').classList.remove('hidden');

                iniciarSimulado(cadernoQuestoes);
            });
        });

        function iniciarSimulado(questoes) {
            let indiceAtual = 0;
            const areaConteudo = document.getElementById('area-conteudo-questao');
            const txtDisciplina = document.getElementById('prova-disciplina');
            const txtProgresso = document.getElementById('prova-progresso');
            const btnProxima = document.getElementById('btn-proxima');
            const btnAnterior = document.getElementById('btn-anterior');

            function mostrarQuestao(indice) {
                const q = questoes[indice];
                txtDisciplina.innerText = q.subject;
                txtProgresso.innerText = `Questão ${indice + 1} de ${questoes.length}`;

                let htmlOpcoes = '';
                if (q.type === 'vf') {
                    // Renderização Certo / Errado (CESPE)
                    htmlOpcoes = `
                        <div class="grid grid-cols-2 gap-4 mt-4">
                            <button onclick="marcarResposta(${indice}, 0)" class="py-3 px-4 border border-blue-200 bg-blue-50/50 hover:bg-blue-100 rounded-xl font-bold text-blue-900 transition text-sm">CERTO</button>
                            <button onclick="marcarResposta(${indice}, 1)" class="py-3 px-4 border border-red-200 bg-red-50/50 hover:bg-red-100 rounded-xl font-bold text-red-900 transition text-sm">ERRADO</button>
                        </div>
                    `;
                } else {
                    // Renderização Múltipla Escolha
                    htmlOpcoes = q.options.map((opt, i) => `
                        <label class="flex items-start p-3.5 border border-slate-200 rounded-xl hover:bg-slate-50 cursor-pointer transition">
                            <input type="radio" name="pergunta_${indice}" value="${i}" class="mt-1 mr-3 accent-blue-600">
                            <span class="text-sm text-slate-700">${opt}</span>
                        </label>
                    `).join('');
                }

                const textoApoioHtml = q.supportText ? `
                    <div class="p-4 bg-slate-50 border-l-4 border-blue-600 rounded-r-xl text-xs text-slate-700 leading-relaxed italic">
                        ${q.supportText}
                    </div>
                ` : '';

                areaConteudo.innerHTML = `
                    ${textoApoioHtml}
                    <p class="text-sm font-semibold text-slate-900 leading-relaxed">${q.q}</p>
                    <div class="space-y-2 mt-4">${htmlOpcoes}</div>
                `;

                btnAnterior.disabled = indice === 0;
                btnAnterior.style.opacity = indice === 0 ? '0.5' : '1';
                btnProxima.innerText = indice === questoes.length - 1 ? 'Finalizar Prova' : 'Próxima Questão';
            }

            btnProxima.onclick = () => {
                if (indiceAtual < questoes.length - 1) {
                    indiceAtual++;
                    mostrarQuestao(indiceAtual);
                } else {
                    alert("Parabéns! Você concluiu o caderno de questões.");
                    location.reload();
                }
            };

            btnAnterior.onclick = () => {
                if (indiceAtual > 0) {
                    indiceAtual--;
                    mostrarQuestao(indiceAtual);
                }
            };

            mostrarQuestao(indiceAtual);
        }
    </script>
</body>
</html>
