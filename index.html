<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP/TJ | Simulador de Estudos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="questoes.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-blue-900 text-lg tracking-tight">MP/TJ</span>
            <span class="text-slate-300">|</span>
            <span class="text-slate-600 font-medium text-sm">Simulador de Questões</span>
        </div>
        <a href="contribua.html" class="text-xs font-bold text-blue-600 hover:underline">Envie Suas Questões →</a>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6">
        
        <!-- Bloco de Configuração do Treino -->
        <div id="painel-config" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <h1 class="text-xl font-bold text-slate-900 mb-1">Configure o seu Simulado</h1>
            <p class="text-xs text-slate-500 mb-6">Personalize as matérias, quantidade de questões e o tempo de prova.</p>

            <!-- Seleção de Cargo Alvo -->
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Cargo Alvo / Perfil:</label>
                <select id="select-cargo" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600">
                    <option value="Tecnico">Técnico - Área Administrativa</option>
                    <option value="AnalistaJuridico">Analista - Direito</option>
                    <option value="AnalistaTI">Analista - Especializada (Sistemas / TI)</option>
                </select>
            </div>

            <!-- Seleção de Matérias (Múltipla Escolha com Checkboxes) -->
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Matérias para o Treino:</label>
                <div id="container-materias-checkboxes" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl max-h-48 overflow-y-auto">
                    <!-- Gerado dinamicamente via JS de acordo com o cargo -->
                </div>
            </div>

            <!-- Configurações de Questões e Tempo -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Quantidade de Questões:</label>
                    <input type="number" id="input-qtd-questoes" value="10" min="1" max="100" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Tempo de Prova (Minutos):</label>
                    <input type="number" id="input-tempo-minutos" value="30" min="1" max="300" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600">
                </div>
            </div>

            <button id="btn-iniciar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-sm">
                Iniciar Simulado com Cronômetro
            </button>
        </div>

        <!-- Bloco de Resposta às Questões (Oculto inicialmente) -->
        <div id="painel-quiz" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <div class="flex items-center space-x-3">
                    <span id="badge-materia" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Matéria</span>
                    <button id="btn-desistir" class="text-[11px] font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3 py-1 rounded-lg transition cursor-pointer">
                        ✕ Desistir / Encerrar
                    </button>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="cronometro" class="text-xs font-mono font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-lg">Tempo: 00:00</span>
                    <span id="contador-questoes" class="text-xs font-semibold text-slate-500">Questão 1 de X</span>
                </div>
            </div>

            <p id="texto-suporte" class="text-xs text-slate-600 bg-slate-50 p-4 rounded-xl mb-4 font-mono hidden"></p>
            
            <h2 id="enunciado-questao" class="text-sm font-bold text-slate-900 mb-6 leading-relaxed"></h2>

            <div id="container-alternativas" class="space-y-3 mb-6">
                <!-- Alternativas injetadas via JS -->
            </div>

            <div class="flex justify-between items-center">
                <span id="aviso-marcada" class="text-[11px] font-medium text-amber-600 hidden">✓ Resposta registrada para esta questão. Você pode alterar ou avançar.</span>
                <button id="btn-proxima" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition shadow-sm ml-auto cursor-pointer">
                    Próxima Questão →
                </button>
            </div>
        </div>

    </main>

    <!-- Script de Execução do Simulador -->
    <script>
        const materiasPorCargo = {
            Tecnico: [
                { id: "banco_pt", nome: "Língua Portuguesa" },
                { id: "banco_rlm", nome: "Matemática e RLM" },
                { id: "banco_info", nome: "Informática" },
                { id: "banco_legis_mppe", nome: "Legislação MPPE" },
                { id: "banco_noc_adm", nome: "Noções de Administração" },
                { id: "banco_const", nome: "Direito Constitucional" },
                { id: "banco_adm", nome: "Direito Administrativo" },
                { id: "banco_civil", nome: "Direito Civil" },
                { id: "banco_proc_civil", nome: "Direito Processual Civil" },
                { id: "banco_penal", nome: "Direito Penal" },
                { id: "banco_proc_penal", nome: "Direito Processual Penal" }
            ],
            AnalistaJuridico: [
                { id: "banco_pt", nome: "Língua Portuguesa" },
                { id: "banco_rlm", nome: "Matemática e RLM" },
                { id: "banco_info", nome: "Informática" },
                { id: "banco_legis_mppe", nome: "Legislação MPPE" },
                { id: "banco_const", nome: "Direito Constitucional" },
                { id: "banco_adm", nome: "Direito Administrativo" },
                { id: "banco_civil", nome: "Direito Civil" },
                { id: "banco_proc_civil", nome: "Direito Processual Civil" },
                { id: "banco_penal", nome: "Direito Penal" },
                { id: "banco_proc_penal", nome: "Direito Processual Penal" }
            ],
            AnalistaTI: [
                { id: "banco_pt", nome: "Língua Portuguesa" },
                { id: "banco_rlm", nome: "Matemática e RLM" },
                { id: "banco_legis_mppe", nome: "Legislação MPPE" },
                { id: "banco_gov_ti", nome: "Governança em TI" },
                { id: "banco_seg_ti", nome: "Segurança, Risco e Continuidade" },
                { id: "banco_eng_soft_ia", nome: "Engenharia de Software e IA" },
                { id: "banco_infra_bd", nome: "Infraestrutura e Banco de Dados" }
            ]
        };

        function atualizarCheckboxesMaterias() {
            const cargo = document.getElementById('select-cargo').value;
            const container = document.getElementById('container-materias-checkboxes');
            if (!container) return;
            container.innerHTML = '';

            const lista = materiasPorCargo[cargo] || [];
            lista.forEach(mat => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer p-1 hover:bg-slate-100 rounded-lg";
                label.innerHTML = `
                    <input type="checkbox" name="materia-filtro" value="${mat.id}" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <span>${mat.nome}</span>
                `;
                container.appendChild(label);
            });
        }

        document.getElementById('select-cargo').addEventListener('change', atualizarCheckboxesMaterias);
        window.addEventListener('DOMContentLoaded', atualizarCheckboxesMaterias);

        let questoesAtivas = [];
        let indiceAtual = 0;
        let respostasUsuario = {}; // Armazena a resposta escolhida pelo usuário por índice da questão
        let tempoRestanteSegundos = 0;
        let timerInterval = null;

        document.getElementById('btn-iniciar').addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('input[name="materia-filtro"]:checked');
            if (checkboxes.length === 0) {
                alert("Selecione pelo menos uma matéria para o seu simulado.");
                return;
            }

            const referenciasBancos = {
                banco_pt: typeof banco_pt !== 'undefined' ? banco_pt : [],
                banco_rlm: typeof banco_rlm !== 'undefined' ? banco_rlm : [],
                banco_info: typeof banco_info !== 'undefined' ? banco_info : [],
                banco_legis_mppe: typeof banco_legis_mppe !== 'undefined' ? banco_legis_mppe : [],
                banco_const: typeof banco_const !== 'undefined' ? banco_const : [],
                banco_adm: typeof banco_adm !== 'undefined' ? banco_adm : [],
                banco_civil: typeof banco_civil !== 'undefined' ? banco_civil : [],
                banco_proc_civil: typeof banco_proc_civil !== 'undefined' ? banco_proc_civil : [],
                banco_penal: typeof banco_penal !== 'undefined' ? banco_penal : [],
                banco_proc_penal: typeof banco_proc_penal !== 'undefined' ? banco_proc_penal : [],
                banco_noc_adm: typeof banco_noc_adm !== 'undefined' ? banco_noc_adm : [],
                banco_gov_ti: typeof banco_gov_ti !== 'undefined' ? banco_gov_ti : [],
                banco_seg_ti: typeof banco_seg_ti !== 'undefined' ? banco_seg_ti : [],
                banco_eng_soft_ia: typeof banco_eng_soft_ia !== 'undefined' ? banco_eng_soft_ia : [],
                banco_infra_bd: typeof banco_infra_bd !== 'undefined' ? banco_infra_bd : []
            };

            let baseQuestoes = [];
            checkboxes.forEach(cb => {
                const idBanco = cb.value;
                const nomeMateria = materiasPorCargo[document.getElementById('select-cargo').value].find(m => m.id === idBanco)?.nome || idBanco;
                
                if (referenciasBancos[idBanco] && Array.isArray(referenciasBancos[idBanco])) {
                    const qComMateria = referenciasBancos[idBanco].map(q => ({ ...q, materiaOrigem: nomeMateria }));
                    baseQuestoes = baseQuestoes.concat(qComMateria);
                }
            });

            if (baseQuestoes.length === 0) {
                alert("Não há questões cadastradas para as matérias selecionadas.");
                return;
            }

            baseQuestoes.sort(() => Math.random() - 0.5);
            const qtdDesejada = parseInt(document.getElementById('input-qtd-questoes').value) || 10;
            questoesAtivas = baseQuestoes.slice(0, qtdDesejada);

            indiceAtual = 0;
            respostasUsuario = {};

            const minutosDesejados = parseInt(document.getElementById('input-tempo-minutos').value) || 30;
            tempoRestanteSegundos = minutosDesejados * 60;

            document.getElementById('painel-config').classList.add('hidden');
            document.getElementById('painel-quiz').classList.remove('hidden');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                tempoRestanteSegundos--;
                if (tempoRestanteSegundos <= 0) {
                    clearInterval(timerInterval);
                    alert("O tempo de prova esgotou!");
                    finalizarSimulado();
                    return;
                }
                atualizarDisplayCronometro();
            }, 1000);

            carregarQuestao();
        });

        function atualizarDisplayCronometro() {
            let min = Math.floor(tempoRestanteSegundos / 60).toString().padStart(2, '0');
            let seg = (tempoRestanteSegundos % 60).toString().padStart(2, '0');
            const cronEl = document.getElementById('cronometro');
            if (cronEl) cronEl.innerText = `Tempo Restante: ${min}:${seg}`;
        }

        function carregarQuestao() {
            if (indiceAtual >= questoesAtivas.length) {
                finalizarSimulado();
                return;
            }

            const q = questoesAtivas[indiceAtual];
            document.getElementById('contador-questoes').innerText = `Questão ${indiceAtual + 1} de ${questoesAtivas.length}`;
            document.getElementById('badge-materia').innerText = `${q.materiaOrigem} (${q.topic || 'Geral'})`;
            
            const suporteEl = document.getElementById('texto-suporte');
            if (q.supportText && q.supportText.trim() !== "") {
                suporteEl.innerHTML = q.supportText;
                suporteEl.classList.remove('hidden');
            } else {
                suporteEl.classList.add('hidden');
            }

            document.getElementById('enunciado-questao').innerHTML = q.q;

            const container = document.getElementById('container-alternativas');
            container.innerHTML = '';

            const avisoMarcada = document.getElementById('aviso-marcada');
            avisoMarcada.classList.add('hidden');

            // Altera o texto do botão na última questão
            const btnProxima = document.getElementById('btn-proxima');
            if (indiceAtual === questoesAtivas.length - 1) {
                btnProxima.innerText = "Finalizar e Ver Resultado 🏁";
            } else {
                btnProxima.innerText = "Próxima Questão →";
            }

            const alternativas = (q.type === 'vf' || (q.options && q.options.length === 2 && q.options.includes("Certo")))
                ? ['Certo', 'Errado'] 
                : q.options;

            alternativas.forEach((opt, idx) => {
                const btn = criarBotaoAlternativa(opt, idx, q);
                // Se o usuário já havia respondido esta questão anteriormente, destaca a escolha
                if (respostasUsuario[indiceAtual] === idx) {
                    marcarBotaoSelecionado(btn);
                    avisoMarcada.classList.remove('hidden');
                }
                container.appendChild(btn);
            });
        }

        function criarBotaoAlternativa(texto, idx, q) {
            const btn = document.createElement('button');
            btn.className = "w-full text-left p-3.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs transition font-medium flex items-center space-x-3 cursor-pointer";
            btn.innerHTML = `<span class="w-6 h-6 flex items-center justify-center rounded-lg bg-slate-200 font-bold text-[10px] text-slate-600">${String.fromCharCode(65 + idx)}</span> <span>${texto}</span>`;
            
            btn.addEventListener('click', () => {
                respostasUsuario[indiceAtual] = idx;
                
                // Atualiza visualmente os botões da questão
                const botoes = document.getElementById('container-alternativas').children;
                for (let b of botoes) {
                    b.classList.remove('bg-blue-50', 'border-blue-400', 'text-blue-900', 'ring-2', 'ring-blue-400');
                    b.classList.add('bg-slate-50', 'border-slate-200');
                }
                marcarBotaoSelecionado(btn);
                document.getElementById('aviso-marcada').classList.remove('hidden');
            });
            return btn;
        }

        function marcarBotaoSelecionado(btn) {
            btn.classList.remove('bg-slate-50', 'border-slate-200');
            btn.classList.add('bg-blue-50', 'border-blue-400', 'text-blue-900', 'ring-2', 'ring-blue-400');
        }

        document.getElementById('btn-proxima').addEventListener('click', () => {
            indiceAtual++;
            carregarQuestao();
        });

        // Botão Desistir
        document.getElementById('btn-desistir').addEventListener('click', () => {
            if (confirm("Deseja realmente desistir do simulado atual e voltar ao início?")) {
                clearInterval(timerInterval);
                document.getElementById('painel-quiz').classList.add('hidden');
                document.getElementById('painel-config').classList.remove('hidden');
            }
        });

        function finalizarSimulado() {
            clearInterval(timerInterval);
            
            let acertos = 0;
            let desempenhoPorMateria = {};

            questoesAtivas.forEach((q, idx) => {
                const escolhida = respostasUsuario[idx];
                const correta = q.answer;
                const acertou = (escolhida === correta);

                if (acertou) acertos++;

                const mat = q.materiaOrigem || "Geral";
                if (!desempenhoPorMateria[mat]) {
                    desempenhoPorMateria[mat] = { total: 0, erros: 0 };
                }
                desempenhoPorMateria[mat].total++;
                if (!acertou) {
                    desempenhoPorMateria[mat].erros++;
                }
            });

            let maiorDificuldade = "Nenhuma registrada";
            let maxErros = -1;
            for (let mat in desempenhoPorMateria) {
                if (desempenhoPorMateria[mat].erros > maxErros) {
                    maxErros = desempenhoPorMateria[mat].erros;
                    maiorDificuldade = mat;
                }
            }

            const percentual = ((acertos / questoesAtivas.length) * 100).toFixed(1);

            let relatorioHTML = `<ul class="space-y-2 mb-6 text-left">`;
            for (let mat in desempenhoPorMateria) {
                let d = desempenhoPorMateria[mat];
                let acertosMat = d.total - d.erros;
                let percMat = ((acertosMat / d.total) * 100).toFixed(0);
                relatorioHTML += `<li class="text-xs bg-slate-50 p-2.5 rounded-lg flex justify-between items-center border border-slate-100">
                    <span class="font-semibold text-slate-700">${mat}</span>
                    <span class="text-slate-600">${acertosMat} acertos de ${d.total} (${percMat}%)</span>
                </li>`;
            }
            relatorioHTML += `</ul>`;

            document.getElementById('painel-quiz').innerHTML = `
                <div class="text-center py-6">
                    <h2 class="text-xl font-bold text-slate-900 mb-1">Simulado Concluído!</h2>
                    <p class="text-xs text-slate-500 mb-6">Aqui está o seu resumo de desempenho oficial.</p>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl">
                            <span class="block text-2xl font-black text-blue-700">${acertos} / ${questoesAtivas.length}</span>
                            <span class="text-[11px] font-bold text-blue-800 uppercase">Percentual de Acertos (${percentual}%)</span>
                        </div>
                        <div class="bg-rose-50 border border-rose-200 p-4 rounded-xl">
                            <span class="block text-sm font-bold text-rose-800 mt-1">${maiorDificuldade}</span>
                            <span class="text-[11px] font-bold text-rose-700 uppercase">Maior Dificuldade</span>
                        </div>
                    </div>

                    <h3 class="text-xs font-bold text-slate-700 uppercase mb-2 text-left">Desempenho Detalhado por Matéria:</h3>
                    ${relatorioHTML}

                    <a href="index.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl text-xs transition shadow-sm">
                        Novo Simulado
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>
