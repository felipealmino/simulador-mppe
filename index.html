<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPPE | Simulador de Estudos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="questoes.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Cabeçalho -->
    <header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-blue-900 text-lg tracking-tight">MPPE</span>
            <span class="text-slate-300">|</span>
            <span class="text-slate-600 font-medium text-sm">Simulador de Questões</span>
        </div>
        <a href="contribua.html" class="text-xs font-bold text-blue-600 hover:underline">Envie Suas Questões →</a>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-6">
        
        <!-- Bloco de Configuração do Treino -->
        <div id="painel-config" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <h1 class="text-xl font-bold text-slate-900 mb-1">Configure o seu treino</h1>
            <p class="text-xs text-slate-500 mb-6">Defina os parâmetros do seu caderno de questões.</p>

            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Cargo Alvo:</label>
                <select id="select-cargo" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600">
                    <option value="Tecnico">Técnico Ministerial - Área Administrativa</option>
                    <option value="AnalistaJuridico">Analista Ministerial - Direito</option>
                    <option value="AnalistaTI">Analista Ministerial - Especializada (Sistemas / TI)</option>
                </select>
            </div>

            <button id="btn-iniciar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-sm mt-4">
                Iniciar Simulador
            </button>
        </div>

        <!-- Bloco de Resposta às Questões (Oculto inicialmente) -->
        <div id="painel-quiz" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 hidden">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <span id="badge-materia" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full">Matéria</span>
                <span id="contador-questoes" class="text-xs font-semibold text-slate-500">Questão 1 de X</span>
            </div>

            <p id="texto-suporte" class="text-xs text-slate-600 bg-slate-50 p-4 rounded-xl mb-4 font-mono hidden"></p>
            
            <h2 id="enunciado-questao" class="text-sm font-bold text-slate-900 mb-6 leading-relaxed"></h2>

            <div id="container-alternativas" class="space-y-3 mb-6">
                <!-- Alternativas injetadas via JS -->
            </div>

            <!-- Caixa de Feedback e Disclaimer -->
            <div id="painel-feedback" class="p-4 rounded-xl mb-6 hidden">
                <p id="texto-feedback" class="text-xs font-bold mb-1"></p>
                <p id="texto-disclaimer" class="text-xs text-slate-600 italic"></p>
            </div>

            <div class="flex justify-end">
                <button id="btn-proxima" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition hidden">
                    Próxima Questão →
                </button>
            </div>
        </div>

    </main>

    <!-- Script de Execução do Simulador -->
    <script>
        let questoesAtivas = [];
        let indiceAtual = 0;
        let acertos = 0;

        document.getElementById('btn-iniciar').addEventListener('click', () => {
            const cargo = document.getElementById('select-cargo').value;
            questoesAtivas = [];

            // Seleciona as bases de acordo com o cargo escolhido
            if (cargo === 'Tecnico') {
                questoesAtivas = [...banco_pt, ...banco_rlm, ...banco_info, ...banco_legis_mppe, ...banco_noc_adm];
            } else if (cargo === 'AnalistaJuridico') {
                questoesAtivas = [...banco_pt, ...banco_rlm, ...banco_info, ...banco_legis_mppe, ...banco_const, ...banco_adm, ...banco_civil, ...banco_proc_civil, ...banco_penal, ...banco_proc_penal];
            } else if (cargo === 'AnalistaTI') {
                questoesAtivas = [...banco_pt, ...banco_rlm, ...banco_legis_mppe, ...banco_gov_ti, ...banco_seg_ti, ...banco_eng_soft_ia, ...banco_infra_bd];
            }

            if (questoesAtivas.length === 0) {
                alert("Nenhuma questão encontrada para este perfil.");
                return;
            }

            // Embaralha as questões para o simulador
            questoesAtivas.sort(() => Math.random() - 0.5);
            indiceAtual = 0;
            acertos = 0;

            document.getElementById('painel-config').classList.add('hidden');
            document.getElementById('painel-quiz').classList.remove('hidden');

            carregarQuestao();
        });

        function carregarQuestao() {
            if (indiceAtual >= questoesAtivas.length) {
                document.getElementById('painel-quiz').innerHTML = `
                    <div class="text-center py-8">
                        <h2 class="text-xl font-bold text-slate-900 mb-2">Simulado Concluído!</h2>
                        <p class="text-xs text-slate-500 mb-6">Você respondeu a todas as questões selecionadas para este treino.</p>
                        <a href="index.html" class="inline-block bg-blue-600 text-white font-bold py-3 px-6 rounded-xl text-xs">Reiniciar Treino</a>
                    </div>
                `;
                return;
            }

            const q = questoesAtivas[indiceAtual];
            document.getElementById('contador-questoes').innerText = `Questão ${indiceAtual + 1} de ${questoesAtivas.length}`;
            document.getElementById('badge-materia').innerText = q.topic || 'Geral';
            
            const suporteEl = document.getElementById('texto-suporte');
            if (q.supportText && q.supportText.trim() !== "") {
                suporteEl.innerHTML = q.supportText;
                suporteEl.classList.remove('hidden');
            } else {
                suporteEl.classList.add('hidden');
            }

            document.getElementById('enunciado-questao').innerHTML = q.q;

            const container = document.getElementById('container-alternativas');
            container.innerHTML = '';

            const feedbackEl = document.getElementById('painel-feedback');
            feedbackEl.classList.add('hidden');
            document.getElementById('btn-proxima').classList.add('hidden');

            if (q.type === 'vf' || (q.options && q.options.length === 2 && q.options.includes("Certo"))) {
                // Questão de Certo / Errado
                ['Certo', 'Errado'].forEach((opt, idx) => {
                    const btn = criarBotaoAlternativa(opt, idx, q);
                    container.appendChild(btn);
                });
            } else {
                // Questão de Múltipla Escolha
                q.options.forEach((opt, idx) => {
                    const btn = criarBotaoAlternativa(opt, idx, q);
                    container.appendChild(btn);
                });
            }
        }

        function criarBotaoAlternativa(texto, idx, q) {
            const btn = document.createElement('button');
            btn.className = "w-full text-left p-3.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs transition font-medium flex items-center space-x-3 cursor-pointer";
            btn.innerHTML = `<span class="w-6 h-6 flex items-center justify-center rounded-lg bg-slate-200 font-bold text-[10px] text-slate-600">${String.fromCharCode(65 + idx)}</span> <span>${texto}</span>`;
            
            btn.addEventListener('click', () => verificarResposta(idx, q.answer, q.disclaimer, btn));
            return btn;
        }

        function verificarResposta(escolhida, correta, disclaimer, btnSelecionado) {
            const botoes = document.getElementById('container-alternativas').children;
            for (let b of botoes) {
                b.disabled = true;
                b.classList.remove('hover:bg-slate-100', 'cursor-pointer');
            }

            const feedbackEl = document.getElementById('painel-feedback');
            const textoFeedback = document.getElementById('texto-feedback');
            const textoDisclaimer = document.getElementById('texto-disclaimer');

            feedbackEl.classList.remove('hidden');
            document.getElementById('btn-proxima').classList.remove('hidden');

            if (escolhida === correta) {
                btnSelecionado.classList.remove('bg-slate-50', 'border-slate-200');
                btnSelecionado.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                feedbackEl.className = "p-4 rounded-xl mb-6 bg-emerald-50 border border-emerald-200";
                textoFeedback.className = "text-xs font-bold mb-1 text-emerald-800";
                textoFeedback.innerText = "✓ Resposta Correta!";
                acertos++;
            } else {
                btnSelecionado.classList.remove('bg-slate-50', 'border-slate-200');
                btnSelecionado.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-900');
                
                // Destaca a correta
                if (botoes[correta]) {
                    botoes[correta].classList.remove('bg-slate-50', 'border-slate-200');
                    botoes[correta].classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
                }

                feedbackEl.className = "p-4 rounded-xl mb-6 bg-rose-50 border border-rose-200";
                textoFeedback.className = "text-xs font-bold mb-1 text-rose-800";
                textoFeedback.innerText = "✕ Resposta Incorreta.";
            }

            textoDisclaimer.innerText = disclaimer ? `Fundamentação: ${disclaimer}` : "Sem fundamentação cadastrada para esta questão.";
        }

        document.getElementById('btn-proxima').addEventListener('click', () => {
            indiceAtual++;
            carregarQuestao();
        });
    </script>
</body>
</html>
